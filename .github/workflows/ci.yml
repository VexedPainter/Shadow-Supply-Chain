name: ShadowSync CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadowsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security audit (dependency CVE scan)
        run: |
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2022-42969  # known safe exceptions

      - name: Run API tests
        env:
          DATABASE_URL:               "postgresql://postgres:postgres@localhost:5432/shadowsync"
          SECRET_KEY:                 "ci-secret-key-not-for-production"
          FIELD_ENCRYPTION_KEY:       ${{ secrets.FIELD_ENCRYPTION_KEY || 'not-set-in-ci' }}
          GROQ_API_KEY:               ${{ secrets.GROQ_API_KEY || '' }}
          COHERE_API_KEY:             ${{ secrets.COHERE_API_KEY || '' }}
          ADMIN_USERNAME:             "admin"
          ADMIN_PASSWORD:             "ShadowSync_Exhibition_2026!"
          ALERT_EMAIL_USER:           ""
          ALERT_EMAIL_TO:             ""
          ALERT_SMTP_HOST:            ""
          SLACK_WEBHOOK_URL:          ""
          FIREBASE_CREDENTIALS_PATH:  ""
        run: |
          python generate_data.py
          python -m uvicorn app:app --host 0.0.0.0 --port 8000 &
          sleep 8
          python test_api.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t shadowsync:${{ github.sha }} .
      - name: Verify health check
        run: |
          docker run -d -p 8000:8000 \
            -e ADMIN_USERNAME=admin \
            -e ADMIN_PASSWORD=ci_test \
            -e SECRET_KEY=ci-health-check-key \
            shadowsync:${{ github.sha }}
          sleep 20
          curl -f http://localhost:8000/login || exit 1
